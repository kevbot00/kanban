stages:
  - build
  - test

build:
  stage: build
  image: node:20
  script:
    - npm ci
    - npm run build

test:e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  services:
    - name: postgres:18-alpine
      alias: postgres
  variables:
    POSTGRES_USER: kanban
    POSTGRES_PASSWORD: kanban
    POSTGRES_DB: kanban_test
    TEST_DATABASE_URL: "postgresql://kanban:kanban@postgres:5432/kanban_test?schema=public"
  before_script:
    - npm ci
    - npx prisma generate --schema api/prisma/schema.prisma
  script:
    - npm run test:e2e
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  artifacts:
    when: always
    paths:
      - e2e/playwright-report/
    expire_in: 1 week
  cache:
    key:
      files: [package-lock.json]
    paths: [node_modules/, .npm]

